<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrinika's Beauty Supply</title>
<meta name="description" content="Terrinika's Beauty Supply is a Black owned beauty supply store specializing in hair extensions, hair care products and beauty products.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Dancing+Script:400,700|Cardo:400,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>

<main data-page-body>
  <section class="store" id="store">
    <div data-catalog></div>
  </section>
  <div data-account-strip></div>
</main>

<script type="module">
  import { renderLayout, accountStripHtml } from "/assets/js/layout.js";
  import { mountCatalog } from "/assets/js/catalog.js";

  renderLayout({ active: "store", hero: true });
  document.querySelector("[data-account-strip]").innerHTML = accountStripHtml();
  mountCatalog(document.querySelector("[data-catalog]"));
</script>
</body>
</html>
