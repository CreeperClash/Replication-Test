<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Orders &middot; Terrinika's Beauty Supply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Dancing+Script:400,700|Cardo:400,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>

<main data-page-body>
  <section class="inner">
    <div class="page" style="max-width:560px">
      <h1 class="page-title">Track orders</h1>
      <p class="breadcrumb"><a href="/#store">Store</a> &nbsp;/&nbsp; Track orders</p>

      <p class="field-help">
        Enter the email address you used at checkout and we'll send you a link
        to your order history.
      </p>

      <form data-track novalidate>
        <label class="visually-hidden" for="order-email">Your email address</label>
        <input class="text-input" id="order-email" type="email"
               placeholder="Your email address" autocomplete="email">
        <p class="form-error" data-error hidden></p>
        <button class="btn btn--primary btn--block" type="submit">Continue</button>
      </form>

      <p class="demo-note">
        <strong>Demo replica &mdash; order lookup is not wired up</strong>
        Order records live in the commerce backend on the live site. This form
        validates input but returns no data.
      </p>
    </div>
  </section>
  <div data-account-strip></div>
</main>

<script type="module">
  import { renderLayout, accountStripHtml, notify } from "/assets/js/layout.js";

  renderLayout({ active: "", hero: true });
  document.querySelector("[data-account-strip]").innerHTML = accountStripHtml();

  const form = document.querySelector("[data-track]");
  const error = form.querySelector("[data-error]");
  const email = form.querySelector("#order-email");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim());
    error.hidden = valid;
    email.setAttribute("aria-invalid", String(!valid));
    if (!valid) {
      error.textContent = "Enter a valid email address.";
      email.focus();
      return;
    }
    notify("Demo replica — no order data is available. Connect your commerce backend to enable this.");
  });
</script>
</body>
</html>
